<!DOCTYPE html>
<html lang="en" id="htmlTag">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AD-PRO Agency | Verified</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --border: rgba(255,255,255,0.1); }
        .light { --bg: #f8fafc; --card: #ffffff; --text: #0f172a; --border: rgba(0,0,0,0.1); }
        body { background: var(--bg); color: var(--text); transition: 0.3s; font-family: system-ui, -apple-system, sans-serif; overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
        .glass { background: var(--card); border: 1px solid var(--border); backdrop-filter: blur(10px); }
        #adminPanel, #checkoutModal { display: none; }
        [dir="rtl"] { text-align: right; }
        input, select, textarea { font-size: 16px !important; color: #fff !important; background: rgba(0,0,0,0.2) !important; }
        .light input, .light select, .light textarea { color: #000 !important; background: rgba(0,0,0,0.05) !important; }
        #cartSidebar { transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .product-card img { transition: transform 0.3s ease; }
        .product-card:active img { transform: scale(0.95); }
    </style>
</head>
<body class="min-h-screen pb-10">

    <nav class="glass sticky top-0 z-[60] p-3 md:p-4 shadow-xl">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl md:text-3xl font-black text-blue-500 italic tracking-tighter">AD-PRO</h1>
            <div class="flex items-center gap-3">
                <button onclick="toggleTheme()" class="p-2 text-lg"><i class="fa-solid fa-circle-half-stroke"></i></button>
                <button onclick="toggleLang()" id="langBtn" class="font-bold border border-blue-500 px-3 py-1 rounded-lg text-xs">العربية</button>
                <div class="relative cursor-pointer p-2" onclick="toggleCart()">
                    <i class="fa-solid fa-cart-shopping text-xl text-blue-500"></i>
                    <span id="cartCount" class="absolute top-0 right-0 bg-red-600 text-[10px] w-4 h-4 flex items-center justify-center rounded-full font-black text-white">0</span>
                </div>
                <button onclick="accessAdmin()" class="opacity-20 p-2"><i class="fa-solid fa-user-shield"></i></button>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto p-4 md:p-6">
        <div class="mb-6 md:mb-10 flex justify-center">
            <div class="relative w-full max-w-xl">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 opacity-30 pointer-events-none"></i>
                <input type="text" id="searchInput" onkeyup="renderStore()" class="w-full p-4 pl-12 rounded-2xl border border-slate-700 outline-none focus:border-blue-500" placeholder="Search...">
            </div>
        </div>

        <div id="adminPanel" class="glass rounded-[1.5rem] md:rounded-[2rem] p-5 md:p-8 mb-10 border border-blue-500/30 shadow-2xl">
            <div class="flex justify-between items-center mb-6">
                <h2 id="t-adminTitle" class="font-black text-blue-400">Dashboard</h2>
                <button onclick="signOut()" id="t-adminExit" class="bg-red-500 text-white px-4 py-1 rounded-lg text-[10px] font-bold">EXIT</button>
            </div>
            <div class="grid lg:grid-cols-2 gap-8">
                <div class="space-y-4">
                    <p id="t-step1" class="text-[10px] font-black opacity-40 uppercase">1. Categories</p>
                    <div class="flex gap-2">
                        <input type="text" id="catInput" class="flex-grow p-3 rounded-xl border border-slate-700 outline-none">
                        <button onclick="addCategory()" id="t-addCatBtn" class="bg-blue-600 px-5 rounded-xl font-black text-xs">ADD</button>
                    </div>
                    <div id="adminCatList" class="flex flex-wrap gap-2"></div>
                </div>
                <div class="space-y-4">
                    <p id="t-step2" class="text-[10px] font-black opacity-40 uppercase">2. Products</p>
                    <select id="catSelect" class="w-full p-3 rounded-xl border border-slate-700"></select>
                    <div class="grid grid-cols-2 gap-3">
                        <input type="text" id="pName" class="p-3 rounded-xl border border-slate-700">
                        <input type="number" id="pPrice" class="p-3 rounded-xl border border-slate-700">
                    </div>
                    <input type="file" id="pImg" accept="image/*" class="w-full text-[10px]">
                    <button onclick="saveProduct()" id="t-saveProdBtn" class="w-full bg-green-600 p-4 rounded-xl font-black text-sm">PUBLISH</button>
                </div>
            </div>
        </div>

        <div id="storeContainer" class="space-y-16"></div>
    </main>

    <div id="checkoutModal" class="fixed inset-0 bg-black/90 backdrop-blur-md z-[100] flex items-center justify-center p-4">
        <div class="glass w-full max-w-lg p-6 md:p-10 rounded-[2.5rem] border border-blue-500/20 shadow-2xl">
            <h2 id="t-checkoutHeader" class="text-3xl font-black mb-6 text-blue-500 italic">ORDER INFO</h2>
            <form onsubmit="finalizeOrder(event)" class="space-y-4">
                <input type="text" id="custName" required class="w-full p-4 rounded-xl border border-slate-700 outline-none">
                <input type="tel" id="custPhone" required class="w-full p-4 rounded-xl border border-slate-700 outline-none">
                <select id="payMethod" class="w-full p-4 rounded-xl border border-slate-700">
                    <option value="Cash" id="t-optCash">Cash</option>
                    <option value="Bank" id="t-optBank">Bank Transfer</option>
                </select>
                <button type="submit" id="t-confirmBtn" class="w-full bg-blue-600 p-5 rounded-xl font-black text-xl shadow-lg">SEND ORDER</button>
                <button type="button" onclick="closeCheckout()" id="t-backBtn" class="w-full text-xs opacity-50 underline">Back</button>
            </form>
        </div>
    </div>

    <div id="cartSidebar" class="fixed right-0 top-0 h-full w-full md:w-[450px] glass z-[80] p-6 flex flex-col translate-x-full shadow-2xl">
        <div class="flex justify-between items-center mb-8">
            <h2 id="t-cartTitle" class="font-black text-3xl text-blue-500">Cart</h2>
            <button onclick="toggleCart()" class="text-4xl">&times;</button>
        </div>
        <div id="cartItems" class="flex-grow space-y-4 overflow-y-auto pr-2"></div>
        <div class="pt-6 border-t border-white/10 mt-4">
            <div class="flex justify-between mb-8 font-black text-3xl">
                <span id="t-totalText">Total</span><span id="cartTotal" class="text-blue-500">$0</span>
            </div>
            <button onclick="openCheckout()" id="t-proceedBtn" class="w-full bg-blue-600 p-5 rounded-2xl font-black text-xl">CHECKOUT</button>
        </div>
    </div>

    <script>
        let appData = JSON.parse(localStorage.getItem('AD_PRO_VERIFIED')) || { categories: [], products: [] };
        let cart = [];
        let lang = localStorage.getItem('AD_LANG') || 'en';
        let theme = localStorage.getItem('AD_THEME') || 'dark';

        const dict = {
            en: {
                lang: "العربية", adminTitle: "Agency Control", adminExit: "EXIT", step1: "1. Categories",
                step2: "2. Products", addCatBtn: "ADD", saveProdBtn: "PUBLISH", checkoutHeader: "ORDER INFO",
                optCash: "Cash", optBank: "Transfer", confirmBtn: "SEND VIA WHATSAPP", backBtn: "Back",
                cartTitle: "Your Cart", totalText: "Total", proceedBtn: "PROCEED", addBtn: "Add to Order",
                success: "Live!", searchPl: "Find a product...", catPl: "New Category...", 
                pNamePl: "Product Name", pPricePl: "Price ($)", custNamePl: "Your Name", 
                custPhonePl: "Phone Number", waPrefix: "New Order from AD-PRO:"
            },
            ar: {
                lang: "English", adminTitle: "لوحة التحكم", adminExit: "خروج", step1: "1. الأقسام",
                step2: "2. المنتجات", addCatBtn: "إضافة", saveProdBtn: "نشر", checkoutHeader: "بيانات الطلب",
                optCash: "كاش", optBank: "تحويل مصرفي", confirmBtn: "إرسال عبر واتساب", backBtn: "رجوع",
                cartTitle: "سلة المشتريات", totalText: "المجموع", proceedBtn: "متابعة الطلب", addBtn: "طلب الآن",
                success: "تم النشر!", searchPl: "بحث عن منتج...", catPl: "قسم جديد...", 
                pNamePl: "اسم المنتج", pPricePl: "السعر", custNamePl: "الاسم بالكامل", 
                custPhonePl: "رقم الهاتف", waPrefix: "طلب جديد من AD-PRO:"
            }
        };

        function toggleLang() { lang = lang === 'en' ? 'ar' : 'en'; localStorage.setItem('AD_LANG', lang); applyAll(); }
        function toggleTheme() { theme = theme === 'dark' ? 'light' : 'dark'; localStorage.setItem('AD_THEME', theme); applyAll(); }

        function applyAll() {
            const t = dict[lang];
            document.getElementById('htmlTag').dir = lang === 'ar' ? 'rtl' : 'ltr';
            document.getElementById('langBtn').innerText = t.lang;
            document.getElementById('t-adminTitle').innerText = t.adminTitle;
            document.getElementById('t-adminExit').innerText = t.adminExit;
            document.getElementById('t-step1').innerText = t.step1;
            document.getElementById('t-step2').innerText = t.step2;
            document.getElementById('t-addCatBtn').innerText = t.addCatBtn;
            document.getElementById('t-saveProdBtn').innerText = t.saveProdBtn;
            document.getElementById('t-checkoutHeader').innerText = t.checkoutHeader;
            document.getElementById('t-optCash').innerText = t.optCash;
            document.getElementById('t-optBank').innerText = t.optBank;
            document.getElementById('t-confirmBtn').innerText = t.confirmBtn;
            document.getElementById('t-backBtn').innerText = t.backBtn;
            document.getElementById('t-cartTitle').innerText = t.cartTitle;
            document.getElementById('t-totalText').innerText = t.totalText;
            document.getElementById('t-proceedBtn').innerText = t.proceedBtn;
            document.getElementById('searchInput').placeholder = t.searchPl;
            document.getElementById('catInput').placeholder = t.catPl;
            document.getElementById('pName').placeholder = t.pNamePl;
            document.getElementById('pPrice').placeholder = t.pPricePl;
            document.getElementById('custName').placeholder = t.custNamePl;
            document.getElementById('custPhone').placeholder = t.custPhonePl;
            document.body.className = theme === 'light' ? 'light min-h-screen pb-10' : 'min-h-screen pb-10';
            renderStore();
        }

        function accessAdmin() { if(prompt("Pass:") === "1234") { document.getElementById('adminPanel').style.display = 'block'; renderStore(); } }
        function signOut() { document.getElementById('adminPanel').style.display = 'none'; renderStore(); }
        function addCategory() { const v = document.getElementById('catInput').value.trim(); if(v) { appData.categories.push(v); save(); renderStore(); document.getElementById('catInput').value = ''; } }
        
        async function saveProduct() {
            const n = document.getElementById('pName').value, p = document.getElementById('pPrice').value, c = document.getElementById('catSelect').value, f = document.getElementById('pImg').files[0];
            if(!n || !p || !c) return;
            let img = "https://via.placeholder.com/400?text=AD-PRO";
            if(f) { 
                img = await new Promise(res => { 
                    const r = new FileReader(); 
                    r.readAsDataURL(f); 
                    r.onload = e => { 
                        const i = new Image(); 
                        i.src = e.target.result; 
                        i.onload = () => { 
                            const cv = document.createElement('canvas'); 
                            cv.width = 400; cv.height = 400; 
                            cv.getContext('2d').drawImage(i, 0, 0, 400, 400); 
                            res(cv.toDataURL('image/jpeg', 0.6)); 
                        } 
                    } 
                }); 
            }
            appData.products.push({ id: Date.now(), name: n, price: p, category: c, img });
            save(); renderStore(); alert(dict[lang].success);
            document.getElementById('pName').value = ''; document.getElementById('pPrice').value = '';
        }

        function renderStore() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            const isAdmin = document.getElementById('adminPanel').style.display === 'block';
            document.getElementById('catSelect').innerHTML = appData.categories.map(c => `<option value="${c}">${c}</option>`).join('');
            document.getElementById('adminCatList').innerHTML = appData.categories.map((c, i) => `<span class="bg-blue-600/20 text-[10px] p-2 rounded-xl border border-blue-500/30 uppercase font-bold">${c} <button onclick="delCat(${i})" class="text-red-500 ml-1">×</button></span>`).join('');
            
            document.getElementById('storeContainer').innerHTML = appData.categories.map(cat => {
                const ps = appData.products.filter(p => p.category === cat && p.name.toLowerCase().includes(q));
                if(ps.length === 0) return "";
                return `<section><h2 class="text-xl md:text-2xl font-black mb-6 border-l-4 border-blue-600 pl-3 italic uppercase">${cat}</h2><div class="grid grid-cols-2 lg:grid-cols-4 gap-4 md:gap-8">${ps.map(p => `
                    <div class="glass p-3 md:p-5 rounded-[1.8rem] md:rounded-[2.5rem] relative border border-white/5 product-card">
                        <img src="${p.img}" class="w-full aspect-square object-cover rounded-[1.4rem] md:rounded-[1.8rem] mb-4">
                        <h4 class="font-bold text-xs md:text-sm truncate px-1">${p.name}</h4>
                        <p class="text-blue-500 font-black text-xl md:text-2xl mb-4 px-1">$${p.price}</p>
                        <button onclick="addToCart(${p.id})" class="w-full bg-blue-600 text-white font-black py-4 rounded-2xl text-[10px] uppercase hover:bg-blue-500 transition">${dict[lang].addBtn}</button>
                        ${isAdmin ? `<button onclick="delProd(${p.id})" class="absolute top-4 right-4 bg-red-600 text-white w-7 h-7 rounded-full flex items-center justify-center">×</button>` : ''}
                    </div>`).join('')}</div></section>`;
            }).join('');
        }

        function addToCart(id) { 
            const p = appData.products.find(x => x.id === id); 
            const ex = cart.find(i => i.id === id); 
            if(ex) ex.qty++; else cart.push({...p, qty: 1}); 
            updateCart(); 
            if(window.innerWidth > 768) toggleCart(); 
        }

        function updateCart() {
            document.getElementById('cartCount').innerText = cart.reduce((s, i) => s + i.qty, 0);
            document.getElementById('cartItems').innerHTML = cart.map((it, i) => `
                <div class="flex justify-between items-center bg-black/20 p-4 rounded-2xl border border-white/5 shadow-inner">
                    <div class="flex items-center gap-4">
                        <img src="${it.img}" class="w-12 h-12 rounded-xl object-cover">
                        <div><p class="font-bold text-xs leading-tight mb-2">${it.name}</p>
                            <div class="flex items-center gap-3">
                                <button onclick="changeQty(${i}, -1)" class="w-7 h-7 bg-slate-700/50 rounded-lg text-white">-</button>
                                <span class="font-black text-blue-400 text-sm">${it.qty}</span>
                                <button onclick="changeQty(${i}, 1)" class="w-7 h-7 bg-slate-700/50 rounded-lg text-white">+</button>
                            </div>
                        </div>
                    </div>
                    <p class="font-black text-blue-500 text-base">$${(Number(it.price) * it.qty).toFixed(0)}</p>
                </div>`).join('');
            document.getElementById('cartTotal').innerText = `$${cart.reduce((s, i) => s + (Number(i.price) * i.qty), 0).toFixed(0)}`;
        }

        function changeQty(idx, d) { cart[idx].qty += d; if(cart[idx].qty <= 0) cart.splice(idx, 1); updateCart(); }
        function toggleCart() { document.getElementById('cartSidebar').classList.toggle('translate-x-full'); }
        function openCheckout() { if(cart.length > 0) document.getElementById('checkoutModal').style.display = 'flex'; }
        function closeCheckout() { document.getElementById('checkoutModal').style.display = 'none'; }

        function finalizeOrder(e) {
            e.preventDefault();
            const name = document.getElementById('custName').value, phone = document.getElementById('custPhone').value, pay = document.getElementById('payMethod').value, total = document.getElementById('cartTotal').innerText;
            let itemsTxt = cart.map(i => `• ${i.name} (x${i.qty}) - $${Number(i.price) * i.qty}`).join('%0A');
            const msg = `${dict[lang].waPrefix}%0A------------------%0A👤 *Name:* ${name}%0A📞 *Phone:* ${phone}%0A💳 *Payment:* ${pay}%0A------------------%0A📦 *Items:*%0A${itemsTxt}%0A------------------%0A💰 *Total:* ${total}`;
            window.open(`https://wa.me/218915124644?text=${msg}`, '_blank');
            cart = []; updateCart(); closeCheckout();
        }

        function save() { localStorage.setItem('AD_PRO_VERIFIED', JSON.stringify(appData)); }
        function delCat(i) { if(confirm("Confirm Delete?")) { appData.categories.splice(i,1); save(); renderStore(); } }
        function delProd(id) { appData.products = appData.products.filter(p => p.id !== id); save(); renderStore(); }

        applyAll();
    </script>
</body>
</html>
