<!DOCTYPE html>
<html lang="ar" id="htmlTag">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>الخط الرفيع للدعاية والإعلان</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --border: rgba(255,255,255,0.1); }
        body { background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; margin: 0; padding: 0; }
        .glass { background: var(--card); border: 1px solid var(--border); }
        #adminPanel, #loginModal { display: none; }
        input, select { background: rgba(0,0,0,0.5) !important; color: white !important; border: 1px solid #334155 !important; padding: 12px; border-radius: 8px; }
        .btn-blue { background: #2563eb; color: white; font-weight: bold; padding: 12px; border-radius: 8px; }
    </style>
</head>
<body>

    <nav class="glass p-4 flex justify-between items-center sticky top-0 z-50">
        <h1 class="text-xl font-bold text-blue-500">الخط الرفيع</h1>
        <button onclick="document.getElementById('loginModal').style.display='flex'" class="opacity-20"><i class="fa-solid fa-user-shield"></i></button>
    </nav>

    <div id="loginModal" class="fixed inset-0 bg-black/90 z-[100] flex items-center justify-center p-4">
        <div class="glass p-6 rounded-xl w-full max-w-sm">
            <input type="password" id="adminPass" class="w-full mb-4 text-center" placeholder="Password">
            <button onclick="login()" class="btn-blue w-full">Login</button>
        </div>
    </div>

    <main class="p-4 max-w-4xl mx-auto">
        <div id="adminPanel" class="glass p-6 rounded-xl mb-10 border-blue-500/50">
            <h2 class="mb-4 font-bold">Admin Panel</h2>
            <div class="space-y-6">
                <div class="flex gap-2">
                    <input type="text" id="newCat" class="flex-grow" placeholder="New Category">
                    <button onclick="addCat()" class="btn-blue">Add</button>
                </div>
                <div class="border-t border-white/10 pt-4">
                    <select id="catSelect" class="w-full mb-2"></select>
                    <input type="text" id="pName" placeholder="Product Name" class="w-full mb-2">
                    <input type="number" id="pPrice" placeholder="Price" class="w-full mb-2">
                    <input type="file" id="pImg" class="w-full text-xs mb-4">
                    <button onclick="addProd()" class="btn-blue w-full bg-green-600">Publish</button>
                </div>
            </div>
        </div>

        <div id="store" class="space-y-10"></div>
    </main>

    <script>
        const API = "https://fine-line-9c84d-default-rtdb.firebaseio.com/storeData";
        let categories = [];
        let products = {};

        async function sync() {
            try {
                const res = await fetch(`${API}.json`);
                const data = await res.json();
                
                // Fixed: Handling empty database safely
                categories = data && data.categories ? Object.values(data.categories) : [];
                products = data && data.products ? data.products : {};
                
                render();
            } catch (e) {
                console.error("Sync Error", e);
            }
        }

        async function addCat() {
            const val = document.getElementById('newCat').value.trim();
            if(!val) return;
            await fetch(`${API}/categories.json`, { method: 'POST', body: JSON.stringify(val) });
            document.getElementById('newCat').value = '';
            sync();
        }

        async function addProd() {
            const name = document.getElementById('pName').value;
            const price = document.getElementById('pPrice').value;
            const cat = document.getElementById('catSelect').value;
            const file = document.getElementById('pImg').files[0];

            if(!name || !price || !cat) return alert("Fill all fields");

            let img = "https://via.placeholder.com/150";
            if(file) {
                const reader = new FileReader();
                img = await new Promise(r => { reader.onload = e => r(e.target.result); reader.readAsDataURL(file); });
            }

            await fetch(`${API}/products.json`, {
                method: 'POST',
                body: JSON.stringify({ name, price, category: cat, img })
            });
            sync();
        }

        function render() {
            const isAdmin = document.getElementById('adminPanel').style.display === 'block';
            
            // Fill Dropdown
            document.getElementById('catSelect').innerHTML = categories.map(c => `<option value="${c}">${c}</option>`).join('');

            // Fill Store
            const storeHTML = categories.map(cat => {
                const ps = Object.entries(products).filter(([id, p]) => p.category === cat);
                return `
                    <section>
                        <h2 class="text-blue-500 font-bold mb-4 border-l-4 border-blue-500 pl-2">${cat}</h2>
                        <div class="grid grid-cols-2 gap-4">
                            ${ps.map(([id, p]) => `
                                <div class="glass p-3 rounded-xl relative">
                                    <img src="${p.img}" class="w-full aspect-square object-cover rounded-lg mb-2">
                                    <div class="text-sm font-bold">${p.name}</div>
                                    <div class="text-blue-400">$${p.price}</div>
                                    ${isAdmin ? `<button onclick="delProd('${id}')" class="absolute top-2 right-2 bg-red-600 w-6 h-6 rounded-full">×</button>` : ''}
                                </div>
                            `).join('')}
                        </div>
                    </section>
                `;
            }).join('');
            
            document.getElementById('store').innerHTML = storeHTML || '<p class="opacity-30 text-center">No data yet.</p>';
        }

        async function delProd(id) {
            await fetch(`${API}/products/${id}.json`, { method: 'DELETE' });
            sync();
        }

        function login() {
            if(document.getElementById('adminPass').value === '1234') {
                document.getElementById('adminPanel').style.display = 'block';
                document.getElementById('loginModal').style.display = 'none';
                render();
            }
        }

        sync();
    </script>
</body>
</html>
