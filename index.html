<!DOCTYPE html>
<html lang="ar" id="htmlTag">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>الخط الرفيع للدعاية والإعلان</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --border: rgba(255,255,255,0.1); }
        body { background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; transition: 0.3s; }
        .glass { background: var(--card); border: 1px solid var(--border); }
        #adminPanel, #loginModal { display: none; }
        input, select { background: rgba(0,0,0,0.3) !important; color: white !important; border: 1px solid #334155 !important; }
    </style>
</head>
<body class="min-h-screen pb-10">

    <nav class="glass sticky top-0 z-[60] p-4 flex justify-between items-center">
        <h1 class="text-xl font-black text-blue-500">الخط الرفيع</h1>
        <button onclick="document.getElementById('loginModal').style.display='flex'" class="opacity-20"><i class="fa-solid fa-user-shield"></i></button>
    </nav>

    <main class="max-w-7xl mx-auto p-4 md:p-6">
        <div id="loginModal" class="fixed inset-0 bg-black/90 z-[110] flex items-center justify-center p-4">
            <div class="glass w-full max-w-sm p-8 rounded-2xl">
                <input type="password" id="adminPassInput" class="w-full p-4 mb-4 rounded-xl text-center" placeholder="Password">
                <button onclick="handleLogin()" class="w-full bg-blue-600 p-4 rounded-xl font-bold">Login</button>
                <button onclick="document.getElementById('loginModal').style.display='none'" class="w-full mt-4 text-xs opacity-50">إلغاء</button>
            </div>
        </div>

        <div id="adminPanel" class="glass rounded-2xl p-6 mb-10 border-blue-500/50">
            <div class="flex justify-between items-center mb-6">
                <h2 class="font-black text-blue-400">لوحة التحكم</h2>
                <button onclick="location.reload()" class="bg-red-500 text-white px-3 py-1 rounded text-xs">خروج</button>
            </div>
            <div class="space-y-6">
                <div>
                    <label class="text-xs opacity-50">إضافة قسم</label>
                    <div class="flex gap-2 mt-1">
                        <input type="text" id="catInput" class="flex-grow p-3 rounded-lg outline-none">
                        <button onclick="addCategory()" class="bg-blue-600 px-6 rounded-lg font-bold">إضافة</button>
                    </div>
                </div>
                <div class="pt-4 border-t border-white/5">
                    <label class="text-xs opacity-50">إضافة منتج</label>
                    <select id="catSelect" class="w-full p-3 rounded-lg mt-1 mb-3"></select>
                    <div class="grid grid-cols-2 gap-3 mb-3">
                        <input type="text" id="pName" placeholder="الاسم" class="p-3 rounded-lg">
                        <input type="number" id="pPrice" placeholder="السعر" class="p-3 rounded-lg">
                    </div>
                    <input type="file" id="pImg" accept="image/*" class="w-full text-xs mb-4">
                    <button onclick="saveProduct()" class="w-full bg-green-600 p-4 rounded-xl font-bold">نشر المنتج</button>
                </div>
            </div>
        </div>

        <div id="storeContainer" class="space-y-12"></div>
    </main>

    <script>
        // CRITICAL FIX: Regional URL for Europe
        const BASE_URL = "https://fine-line-9c84d-default-rtdb.europe-west1.firebasedatabase.app/storeData";
        
        window.appData = { categories: {}, products: {} };

        async function loadStore() {
            try {
                const res = await fetch(`${BASE_URL}.json`);
                const data = await res.json();
                if(data) {
                    window.appData.categories = data.categories || {};
                    window.appData.products = data.products || {};
                }
                renderStore();
            } catch (e) { console.error("Sync Error:", e); }
        }

        async function addCategory() {
            const val = document.getElementById('catInput').value.trim();
            if(!val) return;
            await fetch(`${BASE_URL}/categories.json`, { 
                method: 'POST', 
                body: JSON.stringify(val) 
            });
            document.getElementById('catInput').value = '';
            loadStore();
        }

        async function saveProduct() {
            const n = document.getElementById('pName').value, 
                  p = document.getElementById('pPrice').value, 
                  c = document.getElementById('catSelect').value, 
                  f = document.getElementById('pImg').files[0];
            
            if(!n || !p || !c) return alert("Fill all fields");

            let img = "https://via.placeholder.com/400";
            if(f) {
                const reader = new FileReader();
                img = await new Promise(res => { 
                    reader.onload = e => res(e.target.result); 
                    reader.readAsDataURL(f); 
                });
            }

            await fetch(`${BASE_URL}/products.json`, {
                method: 'POST',
                body: JSON.stringify({ name: n, price: p, category: c, img })
            });
            
            document.getElementById('pName').value = '';
            document.getElementById('pPrice').value = '';
            loadStore();
        }

        function renderStore() {
            const isAdmin = document.getElementById('adminPanel').style.display === 'block';
            const catArr = Object.values(window.appData.categories);
            const prodArr = Object.entries(window.appData.products);

            document.getElementById('catSelect').innerHTML = catArr.map(c => `<option value="${c}">${c}</option>`).join('');
            
            document.getElementById('storeContainer').innerHTML = catArr.map(cat => {
                const ps = prodArr.filter(([id, p]) => p.category === cat);
                return `<section>
                    <h2 class="text-xl font-bold border-l-4 border-blue-600 pl-3 mb-6">${cat}</h2>
                    <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">${ps.map(([id, p]) => `
                        <div class="glass p-3 rounded-2xl relative">
                            <img src="${p.img}" class="w-full aspect-square object-cover rounded-xl mb-3">
                            <h4 class="font-bold text-xs truncate">${p.name}</h4>
                            <p class="text-blue-500 font-black">$${p.price}</p>
                            ${isAdmin ? `<button onclick="delProd('${id}')" class="absolute top-2 right-2 bg-red-600 text-white w-6 h-6 rounded-full text-xs">×</button>` : ''}
                        </div>`).join('')}</div></section>`;
            }).join('');
        }

        async function delProd(id) {
            if(confirm("حذف؟")) {
                await fetch(`${BASE_URL}/products/${id}.json`, { method: 'DELETE' });
                loadStore();
            }
        }

        window.handleLogin = () => {
            if(document.getElementById('adminPassInput').value === '1234') {
                document.getElementById('adminPanel').style.display = 'block';
                document.getElementById('loginModal').style.display = 'none';
                renderStore();
            }
        };

        loadStore();
    </script>
</body>
</html>
