<!DOCTYPE html>
<html lang="ar" id="htmlTag">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>الخط الرفيع للدعاية والإعلان</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --border: rgba(255,255,255,0.1); }
        .light { --bg: #f8fafc; --card: #ffffff; --text: #0f172a; --border: rgba(0,0,0,0.1); }
        body { background: var(--bg); color: var(--text); transition: 0.3s; font-family: system-ui, sans-serif; }
        .glass { background: var(--card); border: 1px solid var(--border); }
        #adminPanel, #loginModal { display: none; }
        input, select { color: #fff !important; background: rgba(0,0,0,0.3) !important; border: 1px solid #334155 !important; }
        .light input, .light select { color: #000 !important; background: #f1f5f9 !important; border: 1px solid #cbd5e1 !important; }
        #debugLog { font-family: monospace; font-size: 10px; color: #64748b; padding: 10px; text-align: left; direction: ltr; }
    </style>
</head>
<body class="min-h-screen pb-10">

    <nav class="glass sticky top-0 z-[60] p-4 shadow-xl">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-black text-blue-500" id="mainLogo">الخط الرفيع</h1>
            <div class="flex items-center gap-4">
                <button onclick="toggleLang()" id="langBtn" class="text-xs border border-blue-500 px-2 py-1 rounded">English</button>
                <button onclick="openLogin()" class="opacity-30"><i class="fa-solid fa-user-shield"></i></button>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto p-4">
        <div id="loginModal" class="fixed inset-0 bg-black/90 z-[100] flex items-center justify-center p-4">
            <div class="glass w-full max-w-sm p-6 rounded-2xl">
                <input type="password" id="adminPassInput" class="w-full p-4 mb-4 rounded-xl text-center" placeholder="Password">
                <button onclick="handleLogin()" class="w-full bg-blue-600 p-4 rounded-xl font-bold">Login</button>
                <button onclick="closeLogin()" class="w-full mt-4 text-xs opacity-50">Cancel</button>
            </div>
        </div>

        <div id="adminPanel" class="glass rounded-2xl p-6 mb-10 border-blue-500/50">
            <div class="flex justify-between mb-6">
                <h2 class="font-bold text-blue-400">Control Panel</h2>
                <button onclick="signOut()" class="text-red-500 text-xs font-bold">EXIT</button>
            </div>
            
            <div class="space-y-6">
                <div>
                    <label class="block text-[10px] uppercase opacity-50 mb-2">Add Category</label>
                    <div class="flex gap-2">
                        <input type="text" id="catInput" class="flex-grow p-3 rounded-lg outline-none">
                        <button onclick="addCategory()" class="bg-blue-600 px-6 rounded-lg font-bold">ADD</button>
                    </div>
                    <div id="adminCatList" class="flex flex-wrap gap-2 mt-3"></div>
                </div>

                <div class="border-t border-white/10 pt-6">
                    <label class="block text-[10px] uppercase opacity-50 mb-2">Add Product</label>
                    <select id="catSelect" class="w-full p-3 rounded-lg mb-3"></select>
                    <div class="grid grid-cols-2 gap-2 mb-3">
                        <input type="text" id="pName" placeholder="Name" class="p-3 rounded-lg">
                        <input type="number" id="pPrice" placeholder="Price" class="p-3 rounded-lg">
                    </div>
                    <input type="file" id="pImg" class="w-full text-xs mb-4">
                    <button onclick="saveProduct()" class="w-full bg-green-600 p-4 rounded-xl font-bold">PUBLISH PRODUCT</button>
                </div>
            </div>
        </div>

        <div id="storeContainer" class="space-y-12"></div>
    </main>

    <div id="debugLog">Status: Initializing...</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, push, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCEW60ZUY2cUdce7O3VCru2ZsJvv1Bhwtc",
            authDomain: "fine-line-9c84d.firebaseapp.com",
            projectId: "fine-line-9c84d",
            storageBucket: "fine-line-9c84d.firebasestorage.app",
            messagingSenderId: "840551158104",
            appId: "1:840551158104:web:b683f55f70a0b873a9d52d",
            databaseURL: "https://fine-line-9c84d-default-rtdb.firebaseio.com"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const log = (msg) => { document.getElementById('debugLog').innerText = "Status: " + msg; console.log(msg); };

        window.appData = { categories: [], products: [] };

        // Real-time listener
        onValue(ref(db, 'storeData'), (snapshot) => {
            const data = snapshot.val();
            log("Database connected successfully");
            if (data) {
                window.appData.categories = data.categories || [];
                window.appData.products = data.products ? Object.values(data.products) : [];
            }
            renderStore();
        }, (error) => {
            log("Connection Error: " + error.message);
        });

        window.addCategory = () => {
            const val = document.getElementById('catInput').value.trim();
            if(!val) return;
            log("Saving category...");
            const updated = [...window.appData.categories, val];
            set(ref(db, 'storeData/categories'), updated)
                .then(() => { 
                    log("Category saved!"); 
                    document.getElementById('catInput').value = ''; 
                })
                .catch(e => log("Save Failed: " + e.message));
        };

        window.saveProduct = async () => {
            const n = document.getElementById('pName').value, 
                  p = document.getElementById('pPrice').value, 
                  c = document.getElementById('catSelect').value, 
                  f = document.getElementById('pImg').files[0];
            
            if(!n || !p || !c) { alert("Missing fields"); return; }
            log("Processing product...");

            let img = "https://via.placeholder.com/400";
            if(f) {
                const reader = new FileReader();
                img = await new Promise(res => {
                    reader.onload = e => res(e.target.result);
                    reader.readAsDataURL(f);
                });
            }

            const newRef = push(ref(db, 'storeData/products'));
            set(newRef, { id: newRef.key, name: n, price: p, category: c, img: img })
                .then(() => {
                    log("Product published!");
                    document.getElementById('pName').value = '';
                    document.getElementById('pPrice').value = '';
                })
                .catch(e => log("Product failed: " + e.message));
        };

        window.renderStore = () => {
            const isAdmin = document.getElementById('adminPanel').style.display === 'block';
            document.getElementById('catSelect').innerHTML = window.appData.categories.map(c => `<option value="${c}">${c}</option>`).join('');
            document.getElementById('adminCatList').innerHTML = window.appData.categories.map((c, i) => `<span class="bg-blue-600/20 p-2 rounded text-[10px]">${c} <button onclick="delCat(${i})" class="text-red-500 ml-1">×</button></span>`).join('');
            
            document.getElementById('storeContainer').innerHTML = window.appData.categories.map(cat => {
                const ps = window.appData.products.filter(p => p.category === cat);
                return `<section><h2 class="text-lg font-bold mb-4 border-l-4 border-blue-600 pl-2 uppercase">${cat}</h2><div class="grid grid-cols-2 gap-4">${ps.map(p => `
                    <div class="glass p-3 rounded-xl relative">
                        <img src="${p.img}" class="w-full aspect-square object-cover rounded-lg mb-2">
                        <div class="text-[10px] font-bold truncate">${p.name}</div>
                        <div class="text-blue-500 font-black">$${p.price}</div>
                        ${isAdmin ? `<button onclick="delProd('${p.id}')" class="absolute top-1 right-1 bg-red-600 text-white w-5 h-5 rounded-full text-[10px]">×</button>` : ''}
                    </div>`).join('')}</div></section>`;
            }).join('');
        };

        window.handleLogin = () => { if(document.getElementById('adminPassInput').value === "1234") { document.getElementById('adminPanel').style.display = 'block'; closeLogin(); renderStore(); } };
        window.openLogin = () => { document.getElementById('loginModal').style.display = 'flex'; };
        window.closeLogin = () => { document.getElementById('loginModal').style.display = 'none'; };
        window.signOut = () => { document.getElementById('adminPanel').style.display = 'none'; renderStore(); };
        window.delCat = (i) => { const nc = [...window.appData.categories]; nc.splice(i,1); set(ref(db, 'storeData/categories'), nc); };
        window.delProd = (id) => { remove(ref(db, `storeData/products/${id}`)); };
    </script>
</body>
</html>
